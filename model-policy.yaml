t3:
  difficulties:
    low:
      provider: codex
      model: gpt-6.1-terra
      options: {reasoningEffort: medium}
    medium:
      provider: codex
      model: gpt-6.1-terra
      options: {reasoningEffort: medium}
    high:
      provider: codex
      model: gpt-6.2-sol
      options: {reasoningEffort: medium}
    hardest:
      provider: claudeAgent
      model: claude-opus-5-5
      options: {effort: high}
  roles:
    task-research:
      provider: codex
      model: gpt-6.1-terra
      options: {reasoningEffort: medium}
    task-implementation:
      provider: codex
      model: gpt-6.2-sol
      options: {reasoningEffort: medium}
    exploration:
      provider: codex
      model: gpt-6.1-terra
      options: {reasoningEffort: medium}
    implementation:
      provider: codex
      model: gpt-6.2-sol
      options: {reasoningEffort: medium}
    review:
      provider: codex
      model: gpt-6.2-sol
      options: {reasoningEffort: high}
    advisor:
      provider: claudeAgent
      model: claude-opus-5-5
      options: {effort: high}
    # Goldfish reviewers only; other reviews use `review`.
    goldfish:
      provider: claudeAgent
      model: claude-sonnet-5-5
      options: {effort: high}
  # Fallback order when a role's selected model is unavailable or out of quota: the role's own model,
  # then each entry below in order, then ask the user. Skip an entry whose model is the one that failed.
  # Keep the role's effort value and pass it under the entry's effort_option. claude-sonnet-5-5 on
  # claudeAgent accepts only effort and rejects fastMode.
  fallbacks:
    - provider: codex
      model: gpt-6.2-sol
      effort_option: reasoningEffort
    - provider: claudeAgent
      model: claude-sonnet-5-5
      effort_option: effort
direct:
  codex:
    roles:
      task-research:
        model: gpt-6.1-terra
        options: {reasoningEffort: medium}
      task-implementation:
        model: gpt-6.2-sol
        options: {reasoningEffort: medium}
      exploration:
        model: gpt-6.1-terra
        options: {reasoningEffort: medium}
      implementation:
        model: gpt-6.2-sol
        options: {reasoningEffort: medium}
      review:
        model: gpt-6.2-sol
        options: {reasoningEffort: high}
      advisor:
        model: gpt-6.2-sol
        options: {reasoningEffort: medium}
  claude:
    roles:
      task-research:
        model: sonnet
        options: {effort: low}
      task-implementation:
        model: sonnet
        options: {effort: high}
      exploration:
        model: sonnet
        options: {effort: low}
      implementation:
        model: sonnet
        options: {effort: high}
      review:
        model: opus
        options: {effort: high}
      advisor:
        model: opus
        options: {effort: high}
      goldfish:
        model: sonnet
        options: {effort: high}
  opencode:
    roles:
      task-research:
        model: openai/gpt-6-luna
        options: {variant: high}
      task-implementation:
        model: openai/gpt-6.2-sol
        options: {variant: medium}
      exploration:
        model: openai/gpt-6-luna
        options: {variant: medium}
      implementation:
        model: openai/gpt-6.2-sol
        options: {variant: medium}
      review:
        model: openai/gpt-6.2-sol
        options: {variant: high}
      advisor:
        model: openai/gpt-6.2-sol
        options: {variant: medium}
